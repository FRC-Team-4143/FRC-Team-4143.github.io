<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Arial, Helvetica, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8590c"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8f8f"/></marker><radialGradient id="sh" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient></defs><circle cx="300" cy="210" r="62" fill="#3b6fd8"/><circle cx="300" cy="210" r="48" fill="#000" fill-opacity=".18"/><circle cx="300" cy="210" r="7" fill="#fff" fill-opacity=".8"/><path d="M235.2 186.4 A69 69 0 1 1 334.5 150.2" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#m)"/><path d="M198.5 173.1 A108 108 0 0 1 361.9 121.5" fill="none" stroke="#6b7684" stroke-width="10" stroke-linecap="round"/><circle cx="270.2442475306668" cy="128.24674199162598" r="28" fill="#f2a033"/><circle cx="270.2442475306668" cy="128.24674199162598" r="28" fill="url(#sh)"/><circle cx="150" cy="250" r="28" fill="#f2a033"/><circle cx="150" cy="250" r="28" fill="url(#sh)"/><path d="M180 248 Q180 240 216 175" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#m)"/><path d="M302.2 110.2 L460.2 18.2" fill="none" stroke="#e8590c" stroke-width="3" marker-end="url(#m)"/><text x="470.2442475306668" y="18.24674199162598" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Exit angle</text><text x="470.2442475306668" y="35.24674199162598" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">set by the hood</text><line x1="470" y1="219" x2="358" y2="220" stroke="#8f8f8f" stroke-width="1"/><circle cx="358" cy="220" r="2.5" fill="#8f8f8f"/><text x="474" y="211" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Flywheel inertia</text><text x="474" y="228" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">heavier wheel keeps its speed</text><line x1="197.79999999999998" y1="114" x2="252.24424753066683" y2="132.24674199162598" stroke="#8f8f8f" stroke-width="1"/><circle cx="252.24424753066683" cy="132.24674199162598" r="2.5" fill="#8f8f8f"/><text x="34" y="91" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Compression</text><text x="34" y="108" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">gap between wheel and hood</text><line x1="474" y1="130" x2="370" y2="120" stroke="#8f8f8f" stroke-width="1"/><circle cx="370" cy="120" r="2.5" fill="#8f8f8f"/><text x="474" y="146" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Adjustable hood</text><text x="474" y="163" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">changes the shot distance</text><line x1="150" y1="280" x2="150" y2="265" stroke="#8f8f8f" stroke-width="1"/><circle cx="150" cy="265" r="2.5" fill="#8f8f8f"/><text x="34" y="296" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Feed every piece the same way</text><text x="34" y="313" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">consistency beats power</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Arial, Helvetica, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8590c"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8f8f"/></marker><radialGradient id="sh" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient></defs><circle cx="300" cy="210" r="62" fill="#3b6fd8"/><circle cx="300" cy="210" r="48" fill="#000" fill-opacity=".18"/><circle cx="300" cy="210" r="7" fill="#fff" fill-opacity=".8"/><path d="M312.3 176.2 A36 36 0 1 1 268.8 228.0" fill="none" stroke="#e8590c" stroke-width="3" marker-end="url(#m)"/><path d="M206.5 264.0 A108 108 0 0 1 246.0 116.5" fill="none" stroke="#6b7684" stroke-width="10" stroke-linecap="round"/><circle cx="220.1261272331978" cy="180.92828781731816" r="28" fill="#f2a033"/><circle cx="220.1261272331978" cy="180.92828781731816" r="28" fill="url(#sh)"/><circle cx="120" cy="262" r="28" fill="#f2a033"/><circle cx="120" cy="262" r="28" fill="url(#sh)"/><path d="M152 262 Q195 262 214 248" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#m)"/><path d="M268 118 L415 33" fill="none" stroke="#e8590c" stroke-width="3" marker-end="url(#m)"/><text x="425" y="36" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Exit angle</text><text x="425" y="53" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">set by where the hood ends</text><line x1="470" y1="219" x2="358" y2="220" stroke="#8f8f8f" stroke-width="1"/><circle cx="358" cy="220" r="2.5" fill="#8f8f8f"/><text x="474" y="211" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Flywheel inertia</text><text x="474" y="228" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">heavier wheel keeps its speed</text><line x1="197.79999999999998" y1="114" x2="212" y2="166" stroke="#8f8f8f" stroke-width="1"/><circle cx="212" cy="166" r="2.5" fill="#8f8f8f"/><text x="34" y="91" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Compression</text><text x="34" y="108" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">gap between wheel and hood</text><line x1="185.2" y1="59" x2="224" y2="134" stroke="#8f8f8f" stroke-width="1"/><circle cx="224" cy="134" r="2.5" fill="#8f8f8f"/><text x="34" y="36" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Adjustable hood</text><text x="34" y="53" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">pivots to change the arc</text><line x1="334" y1="280" x2="148" y2="268" stroke="#8f8f8f" stroke-width="1"/><circle cx="148" cy="268" r="2.5" fill="#8f8f8f"/><text x="334" y="296" fill="#8f8f8f" font-size="14" font-weight="bold" text-anchor="start">Feed every piece the same way</text><text x="334" y="313" fill="#8f8f8f" font-size="12" font-weight="normal" text-anchor="start">consistency beats power</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">A ParallelDeadline stops everything when its first child finishes</title><desc id="d">Follow path and Intake on event run together. When Follow path, the deadline, succeeds, Intake on event is halted and the node succeeds.</desc><style>@keyframes ke-path{0%{stroke:#facc15}26.316%{stroke:#facc15}47.368%{stroke:#facc15}86.842%{stroke:#9ca3af}100%{stroke:#9ca3af}}@keyframes kew-path{0%{stroke-width:3}26.316%{stroke-width:3}47.368%{stroke-width:3}86.842%{stroke-width:1.6}100%{stroke-width:1.6}}@keyframes ke-intake{0%{stroke:#facc15}26.316%{stroke:#facc15}47.368%{stroke:#9ca3af}86.842%{stroke:#9ca3af}100%{stroke:#9ca3af}}@keyframes kew-intake{0%{stroke-width:3}26.316%{stroke-width:3}47.368%{stroke-width:1.6}86.842%{stroke-width:1.6}100%{stroke-width:1.6}}@keyframes kr-pd{0%{fill:#f59e0b}26.316%{fill:#f59e0b}47.368%{fill:#16a34a}86.842%{fill:#6b7280}100%{fill:#6b7280}}@keyframes kg-pd{0%{opacity:1}26.316%{opacity:1}47.368%{opacity:1}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-pd-running{0%{opacity:1}26.316%{opacity:1}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-pd-success{0%{opacity:0}26.316%{opacity:0}47.368%{opacity:1}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-pd-failure{0%{opacity:0}26.316%{opacity:0}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kr-path{0%{fill:#f59e0b}26.316%{fill:#f59e0b}47.368%{fill:#16a34a}86.842%{fill:#6b7280}100%{fill:#6b7280}}@keyframes kg-path{0%{opacity:1}26.316%{opacity:1}47.368%{opacity:1}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-path-running{0%{opacity:1}26.316%{opacity:1}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-path-success{0%{opacity:0}26.316%{opacity:0}47.368%{opacity:1}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-path-failure{0%{opacity:0}26.316%{opacity:0}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kr-intake{0%{fill:#f59e0b}26.316%{fill:#f59e0b}47.368%{fill:#6b7280}86.842%{fill:#6b7280}100%{fill:#6b7280}}@keyframes kg-intake{0%{opacity:1}26.316%{opacity:1}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-intake-running{0%{opacity:1}26.316%{opacity:1}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-intake-success{0%{opacity:0}26.316%{opacity:0}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kb-intake-failure{0%{opacity:0}26.316%{opacity:0}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kf0{0%{opacity:1}26.316%{opacity:0}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kf1{0%{opacity:0}26.316%{opacity:1}47.368%{opacity:0}86.842%{opacity:0}100%{opacity:0}}@keyframes kf2{0%{opacity:0}26.316%{opacity:0}47.368%{opacity:1}86.842%{opacity:0}100%{opacity:0}}@keyframes kf3{0%{opacity:0}26.316%{opacity:0}47.368%{opacity:0}86.842%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion:no-preference){.e-path{animation:ke-path 7.60s infinite step-end}.e-path{animation:ke-path 7.60s infinite step-end,kew-path 7.60s infinite step-end}.e-intake{animation:ke-intake 7.60s infinite step-end}.e-intake{animation:ke-intake 7.60s infinite step-end,kew-intake 7.60s infinite step-end}.r-pd{animation:kr-pd 7.60s infinite step-end}.g-pd{animation:kg-pd 7.60s infinite step-end}.b-pd-running{animation:kb-pd-running 7.60s infinite step-end}.b-pd-success{animation:kb-pd-success 7.60s infinite step-end}.b-pd-failure{animation:kb-pd-failure 7.60s infinite step-end}.r-path{animation:kr-path 7.60s infinite step-end}.g-path{animation:kg-path 7.60s infinite step-end}.b-path-running{animation:kb-path-running 7.60s infinite step-end}.b-path-success{animation:kb-path-success 7.60s infinite step-end}.b-path-failure{animation:kb-path-failure 7.60s infinite step-end}.r-intake{animation:kr-intake 7.60s infinite step-end}.g-intake{animation:kg-intake 7.60s infinite step-end}.b-intake-running{animation:kb-intake-running 7.60s infinite step-end}.b-intake-success{animation:kb-intake-success 7.60s infinite step-end}.b-intake-failure{animation:kb-intake-failure 7.60s infinite step-end}.f0{animation:kf0 7.60s infinite step-end}.f1{animation:kf1 7.60s infinite step-end}.f2{animation:kf2 7.60s infinite step-end}.f3{animation:kf3 7.60s infinite step-end}}</style><path class="e-path" d="M320 75.0V106.0H170V137.0" fill="none" stroke="#facc15" stroke-width="3" stroke-linejoin="round"/><path class="e-intake" d="M320 75.0V106.0H470V137.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/><rect class="r-pd" x="230.5" y="37.0" width="179" height="38" rx="7" fill="#16a34a"/><rect class="g-pd" x="226.5" y="33.0" width="187" height="46" rx="11" fill="none" stroke="#facc15" stroke-width="3" opacity="1"/><text x="320" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">⇉ ParallelDeadline</text><g class="b-pd-running" opacity="0"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-pd-success" opacity="1"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-pd-failure" opacity="0"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect class="r-path" x="110.0" y="137.0" width="120" height="38" rx="19.0" fill="#16a34a"/><rect class="g-path" x="106.0" y="133.0" width="128" height="46" rx="23.0" fill="none" stroke="#facc15" stroke-width="3" opacity="1"/><text x="170" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Follow path</text><g class="b-path-running" opacity="0"><rect x="136" y="168.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="170" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-path-success" opacity="1"><rect x="136" y="168.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="170" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-path-failure" opacity="0"><rect x="136" y="168.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="170" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect class="r-intake" x="393.0" y="137.0" width="154" height="38" rx="19.0" fill="#6b7280"/><rect class="g-intake" x="389.0" y="133.0" width="162" height="46" rx="23.0" fill="none" stroke="#facc15" stroke-width="3" opacity="0"/><text x="470" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Intake on event</text><g class="b-intake-running" opacity="0"><rect x="436" y="168.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="470" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-intake-success" opacity="0"><rect x="436" y="168.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="470" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-intake-failure" opacity="0"><rect x="436" y="168.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="470" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect x="370" y="12" width="250" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><circle cx="386" cy="25" r="5" fill="#6b7280"/><text x="395" y="29" font-size="10.5" fill="#e8eaf0">idle</text><circle cx="446" cy="25" r="5" fill="#f59e0b"/><text x="455" y="29" font-size="10.5" fill="#e8eaf0">running</text><circle cx="506" cy="25" r="5" fill="#16a34a"/><text x="515" y="29" font-size="10.5" fill="#e8eaf0">success</text><circle cx="566" cy="25" r="5" fill="#dc2626"/><text x="575" y="29" font-size="10.5" fill="#e8eaf0">failure</text><rect x="20" y="12" width="104" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><rect x="20" y="230" width="600" height="58" rx="9" fill="#1e2433" stroke="#3b4357"/><g class="f0" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 1</text><text x="36" y="254" font-size="14" fill="#e8eaf0">A ParallelDeadline ticks all of its children together every tick.</text><text x="36" y="274" font-size="14" fill="#e8eaf0">The first child, Follow path, is the deadline.</text></g><g class="f1" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 2</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Both are RUNNING, so the ParallelDeadline is RUNNING.</text></g><g class="f2" opacity="1"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 3</text><text x="36" y="254" font-size="14" fill="#e8eaf0">The deadline child finishes: SUCCESS. The others are halted,</text><text x="36" y="274" font-size="14" fill="#e8eaf0">even though Intake on event never completed.</text></g><g class="f3" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Next run</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Everything is reset for the next run.</text></g></svg>

ames kb-shoot-running{0%{opacity:0}16.822%{opacity:0}30.841%{opacity:0}49.533%{opacity:1}66.355%{opacity:0}88.785%{opacity:0}100%{opacity:0}}@keyframes kb-shoot-success{0%{opacity:0}16.822%{opacity:0}30.841%{opacity:0}49.533%{opacity:0}66.355%{opacity:1}88.785%{opacity:0}100%{opacity:0}}@keyframes kb-shoot-failure{0%{opacity:0}16.822%{opacity:0}30.841%{opacity:0}49.533%{opacity:0}66.355%{opacity:0}88.785%{opacity:0}100%{opacity:0}}@keyframes kf0{0%{opacity:1}16.822%{opacity:0}30.841%{opacity:0}49.533%{opacity:0}66.355%{opacity:0}88.785%{opacity:0}100%{opacity:0}}@keyframes kf1{0%{opacity:0}16.822%{opacity:1}30.841%{opacity:0}49.533%{opacity:0}66.355%{opacity:0}88.785%{opacity:0}100%{opacity:0}}@keyframes kf2{0%{opacity:0}16.822%{opacity:0}30.841%{opacity:1}49.533%{opacity:0}66.355%{opacity:0}88.785%{opacity:0}100%{opacity:0}}@keyframes kf3{0%{opacity:0}16.822%{opacity:0}30.841%{opacity:0}49.533%{opacity:1}66.355%{opacity:0}88.785%{opacity:0}100%{opacity:0}}@keyframes kf4{0%{opacity:0}16.822%{opacity:0}30.841%{opacity:0}49.533%{opacity:0}66.355%{opacity:1}88.785%{opacity:0}100%{opacity:0}}@keyframes kf5{0%{opacity:0}16.822%{opacity:0}30.841%{opacity:0}49.533%{opacity:0}66.355%{opacity:0}88.785%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion:no-preference){.e-drive{animation:ke-drive 10.70s infinite step-end}.e-drive{animation:ke-drive 10.70s infinite step-end,kew-drive 10.70s infinite step-end}.e-aim{animation:ke-aim 10.70s infinite step-end}.e-aim{animation:ke-aim 10.70s infinite step-end,kew-aim 10.70s infinite step-end}.e-shoot{animation:ke-shoot 10.70s infinite step-end}.e-shoot{animation:ke-shoot 10.70s infinite step-end,kew-shoot 10.70s infinite step-end}.r-seq{animation:kr-seq 10.70s infinite step-end}.g-seq{animation:kg-seq 10.70s infinite step-end}.b-seq-running{animation:kb-seq-running 10.70s infinite step-end}.b-seq-success{animation:kb-seq-success 10.70s infinite step-end}.b-seq-failure{animation:kb-seq-failure 10.70s infinite step-end}.r-drive{animation:kr-drive 10.70s infinite step-end}.g-drive{animation:kg-drive 10.70s infinite step-end}.b-drive-running{animation:kb-drive-running 10.70s infinite step-end}.b-drive-success{animation:kb-drive-success 10.70s infinite step-end}.b-drive-failure{animation:kb-drive-failure 10.70s infinite step-end}.r-aim{animation:kr-aim 10.70s infinite step-end}.g-aim{animation:kg-aim 10.70s infinite step-end}.b-aim-running{animation:kb-aim-running 10.70s infinite step-end}.b-aim-success{animation:kb-aim-success 10.70s infinite step-end}.b-aim-failure{animation:kb-aim-failure 10.70s infinite step-end}.r-shoot{animation:kr-shoot 10.70s infinite step-end}.g-shoot{animation:kg-shoot 10.70s infinite step-end}.b-shoot-running{animation:kb-shoot-running 10.70s infinite step-end}.b-shoot-success{animation:kb-shoot-success 10.70s infinite step-end}.b-shoot-failure{animation:kb-shoot-failure 10.70s infinite step-end}.f0{animation:kf0 10.70s infinite step-end}.f1{animation:kf1 10.70s infinite step-end}.f2{animation:kf2 10.70s infinite step-end}.f3{animation:kf3 10.70s infinite step-end}.f4{animation:kf4 10.70s infinite step-end}.f5{animation:kf5 10.70s infinite step-end}}</style><path class="e-drive" d="M320 75.0V106.0H110V137.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/><path class="e-aim" d="M320 75.0V106.0H320V137.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/><path class="e-shoot" d="M320 75.0V106.0H530V137.0" fill="none" stroke="#facc15" stroke-width="3" stroke-linejoin="round"/><rect class="r-seq" x="264.0" y="37.0" width="112" height="38" rx="7" fill="#16a34a"/><rect class="g-seq" x="260.0" y="33.0" width="120" height="46" rx="11" fill="none" stroke="#facc15" stroke-width="3" opacity="1"/><text x="320" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">→ Sequence</text><g class="b-seq-running" opacity="0"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-seq-success" opacity="1"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-seq-failure" opacity="0"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect class="r-drive" x="54.0" y="137.0" width="112" height="38" rx="19.0" fill="#16a34a"/><rect class="g-drive" x="50.0" y="133.0" width="120" height="46" rx="23.0" fill="none" stroke="#facc15" stroke-width="3" opacity="0"/><text x="110" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Drive path</text><g class="b-drive-running" opacity="0"><rect x="76" y="168.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="110" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-drive-success" opacity="1"><rect x="76" y="168.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="110" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-drive-failure" opacity="0"><rect x="76" y="168.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="110" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect class="r-aim" x="264.0" y="137.0" width="112" height="38" rx="19.0" fill="#16a34a"/><rect class="g-aim" x="260.0" y="133.0" width="120" height="46" rx="23.0" fill="none" stroke="#facc15" stroke-width="3" opacity="0"/><text x="320" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Aim</text><g class="b-aim-running" opacity="0"><rect x="286" y="168.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="320" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-aim-success" opacity="1"><rect x="286" y="168.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="320" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-aim-failure" opacity="0"><rect x="286" y="168.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="320" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect class="r-shoot" x="474.0" y="137.0" width="112" height="38" rx="19.0" fill="#16a34a"/><rect class="g-shoot" x="470.0" y="133.0" width="120" height="46" rx="23.0" fill="none" stroke="#facc15" stroke-width="3" opacity="1"/><text x="530" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Shoot</text><g class="b-shoot-running" opacity="0"><rect x="496" y="168.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="530" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-shoot-success" opacity="1"><rect x="496" y="168.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="530" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-shoot-failure" opacity="0"><rect x="496" y="168.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="530" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect x="370" y="12" width="250" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><circle cx="386" cy="25" r="5" fill="#6b7280"/><text x="395" y="29" font-size="10.5" fill="#e8eaf0">idle</text><circle cx="446" cy="25" r="5" fill="#f59e0b"/><text x="455" y="29" font-size="10.5" fill="#e8eaf0">running</text><circle cx="506" cy="25" r="5" fill="#16a34a"/><text x="515" y="29" font-size="10.5" fill="#e8eaf0">success</text><circle cx="566" cy="25" r="5" fill="#dc2626"/><text x="575" y="29" font-size="10.5" fill="#e8eaf0">failure</text><rect x="20" y="12" width="104" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><rect x="20" y="230" width="600" height="58" rx="9" fill="#1e2433" stroke="#3b4357"/><g class="f0" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 1</text><text x="36" y="254" font-size="14" fill="#e8eaf0">The Sequence ticks its first child. Driving takes time,</text><text x="36" y="274" font-size="14" fill="#e8eaf0">so Drive path answers RUNNING, and so does the Sequence.</text></g><g class="f1" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 2</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Next tick the Sequence resumes at the child that was RUNNING.</text><text x="36" y="274" font-size="14" fill="#e8eaf0">Still driving, so still RUNNING.</text></g><g class="f2" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 3</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Drive path finishes: SUCCESS. The Sequence moves on to the next</text><text x="36" y="274" font-size="14" fill="#e8eaf0">child in the same tick. Aim starts and is RUNNING.</text></g><g class="f3" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 4</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Aim reports SUCCESS, so Shoot is ticked right away.</text><text x="36" y="274" font-size="14" fill="#e8eaf0">Shoot is RUNNING.</text></g><g class="f4" opacity="1"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 5</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Every child succeeded, so the Sequence reports SUCCESS</text><text x="36" y="274" font-size="14" fill="#e8eaf0">to its parent.</text></g><g class="f5" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Next run</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Its parent can now run the Sequence again from the start.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">A ReactiveSequence re-checks its conditions every tick</title><desc id="d">A ReactiveSequence asks Has game piece? again on every tick. When it fails, Drive path is halted and the sequence fails.</desc><style>@keyframes ke-cond{0%{stroke:#facc15}23.81%{stroke:#facc15}52.381%{stroke:#facc15}88.095%{stroke:#9ca3af}100%{stroke:#9ca3af}}@keyframes kew-cond{0%{stroke-width:3}23.81%{stroke-width:3}52.381%{stroke-width:3}88.095%{stroke-width:1.6}100%{stroke-width:1.6}}@keyframes ke-drive{0%{stroke:#facc15}23.81%{stroke:#facc15}52.381%{stroke:#9ca3af}88.095%{stroke:#9ca3af}100%{stroke:#9ca3af}}@keyframes kew-drive{0%{stroke-width:3}23.81%{stroke-width:3}52.381%{stroke-width:1.6}88.095%{stroke-width:1.6}100%{stroke-width:1.6}}@keyframes kr-rs{0%{fill:#f59e0b}23.81%{fill:#f59e0b}52.381%{fill:#dc2626}88.095%{fill:#6b7280}100%{fill:#6b7280}}@keyframes kg-rs{0%{opacity:1}23.81%{opacity:1}52.381%{opacity:1}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-rs-running{0%{opacity:1}23.81%{opacity:1}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-rs-success{0%{opacity:0}23.81%{opacity:0}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-rs-failure{0%{opacity:0}23.81%{opacity:0}52.381%{opacity:1}88.095%{opacity:0}100%{opacity:0}}@keyframes kr-cond{0%{fill:#16a34a}23.81%{fill:#16a34a}52.381%{fill:#dc2626}88.095%{fill:#6b7280}100%{fill:#6b7280}}@keyframes kg-cond{0%{opacity:1}23.81%{opacity:1}52.381%{opacity:1}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-cond-running{0%{opacity:0}23.81%{opacity:0}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-cond-success{0%{opacity:1}23.81%{opacity:1}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-cond-failure{0%{opacity:0}23.81%{opacity:0}52.381%{opacity:1}88.095%{opacity:0}100%{opacity:0}}@keyframes kr-drive{0%{fill:#f59e0b}23.81%{fill:#f59e0b}52.381%{fill:#6b7280}88.095%{fill:#6b7280}100%{fill:#6b7280}}@keyframes kg-drive{0%{opacity:1}23.81%{opacity:1}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-drive-running{0%{opacity:1}23.81%{opacity:1}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-drive-success{0%{opacity:0}23.81%{opacity:0}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kb-drive-failure{0%{opacity:0}23.81%{opacity:0}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kf0{0%{opacity:1}23.81%{opacity:0}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kf1{0%{opacity:0}23.81%{opacity:1}52.381%{opacity:0}88.095%{opacity:0}100%{opacity:0}}@keyframes kf2{0%{opacity:0}23.81%{opacity:0}52.381%{opacity:1}88.095%{opacity:0}100%{opacity:0}}@keyframes kf3{0%{opacity:0}23.81%{opacity:0}52.381%{opacity:0}88.095%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion:no-preference){.e-cond{animation:ke-cond 8.40s infinite step-end}.e-cond{animation:ke-cond 8.40s infinite step-end,kew-cond 8.40s infinite step-end}.e-drive{animation:ke-drive 8.40s infinite step-end}.e-drive{animation:ke-drive 8.40s infinite step-end,kew-drive 8.40s infinite step-end}.r-rs{animation:kr-rs 8.40s infinite step-end}.g-rs{animation:kg-rs 8.40s infinite step-end}.b-rs-running{animation:kb-rs-running 8.40s infinite step-end}.b-rs-success{animation:kb-rs-success 8.40s infinite step-end}.b-rs-failure{animation:kb-rs-failure 8.40s infinite step-end}.r-cond{animation:kr-cond 8.40s infinite step-end}.g-cond{animation:kg-cond 8.40s infinite step-end}.b-cond-running{animation:kb-cond-running 8.40s infinite step-end}.b-cond-success{animation:kb-cond-success 8.40s infinite step-end}.b-cond-failure{animation:kb-cond-failure 8.40s infinite step-end}.r-drive{animation:kr-drive 8.40s infinite step-end}.g-drive{animation:kg-drive 8.40s infinite step-end}.b-drive-running{animation:kb-drive-running 8.40s infinite step-end}.b-drive-success{animation:kb-drive-success 8.40s infinite step-end}.b-drive-failure{animation:kb-drive-failure 8.40s infinite step-end}.f0{animation:kf0 8.40s infinite step-end}.f1{animation:kf1 8.40s infinite step-end}.f2{animation:kf2 8.40s infinite step-end}.f3{animation:kf3 8.40s infinite step-end}}</style><path class="e-cond" d="M320 75.0V106.0H170V137.0" fill="none" stroke="#facc15" stroke-width="3" stroke-linejoin="round"/><path class="e-drive" d="M320 75.0V106.0H470V137.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/><rect class="r-rs" x="230.5" y="37.0" width="179" height="38" rx="7" fill="#dc2626"/><rect class="g-rs" x="226.5" y="33.0" width="187" height="46" rx="11" fill="none" stroke="#facc15" stroke-width="3" opacity="1"/><text x="320" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">→ ReactiveSequence</text><g class="b-rs-running" opacity="0"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-rs-success" opacity="0"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-rs-failure" opacity="1"><rect x="286" y="68.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="320" y="80.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect class="r-cond" x="93.0" y="137.0" width="154" height="38" rx="19.0" fill="#dc2626"/><rect class="g-cond" x="89.0" y="133.0" width="162" height="46" rx="23.0" fill="none" stroke="#facc15" stroke-width="3" opacity="1"/><text x="170" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Has game piece?</text><g class="b-cond-running" opacity="0"><rect x="136" y="168.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="170" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-cond-success" opacity="0"><rect x="136" y="168.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="170" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-cond-failure" opacity="1"><rect x="136" y="168.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="170" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect class="r-drive" x="414.0" y="137.0" width="112" height="38" rx="19.0" fill="#6b7280"/><rect class="g-drive" x="410.0" y="133.0" width="120" height="46" rx="23.0" fill="none" stroke="#facc15" stroke-width="3" opacity="0"/><text x="470" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Drive path</text><g class="b-drive-running" opacity="0"><rect x="436" y="168.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="470" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-drive-success" opacity="0"><rect x="436" y="168.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="470" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-drive-failure" opacity="0"><rect x="436" y="168.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="470" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect x="370" y="12" width="250" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><circle cx="386" cy="25" r="5" fill="#6b7280"/><text x="395" y="29" font-size="10.5" fill="#e8eaf0">idle</text><circle cx="446" cy="25" r="5" fill="#f59e0b"/><text x="455" y="29" font-size="10.5" fill="#e8eaf0">running</text><circle cx="506" cy="25" r="5" fill="#16a34a"/><text x="515" y="29" font-size="10.5" fill="#e8eaf0">success</text><circle cx="566" cy="25" r="5" fill="#dc2626"/><text x="575" y="29" font-size="10.5" fill="#e8eaf0">failure</text><rect x="20" y="12" width="104" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><rect x="20" y="230" width="600" height="58" rx="9" fill="#1e2433" stroke="#3b4357"/><g class="f0" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 1</text><text x="36" y="254" font-size="14" fill="#e8eaf0">A ReactiveSequence re-checks its earlier children on every tick.</text><text x="36" y="274" font-size="14" fill="#e8eaf0">Tick 1: the condition passes and Drive path starts.</text></g><g class="f1" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 2</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Tick 2: the condition is asked again even though Drive path is</text><text x="36" y="274" font-size="14" fill="#e8eaf0">RUNNING. (A plain Sequence would resume at Drive path.)</text></g><g class="f2" opacity="1"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 3</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Tick 3: the game piece is gone. The condition FAILS, Drive path</text><text x="36" y="274" font-size="14" fill="#e8eaf0">is halted, and the ReactiveSequence reports FAILURE.</text></g><g class="f3" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Next run</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Everything is reset for the next run.</text></g></svg>

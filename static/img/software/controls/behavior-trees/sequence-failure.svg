"168.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="530" y="180.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect x="370" y="12" width="250" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><circle cx="386" cy="25" r="5" fill="#6b7280"/><text x="395" y="29" font-size="10.5" fill="#e8eaf0">idle</text><circle cx="446" cy="25" r="5" fill="#f59e0b"/><text x="455" y="29" font-size="10.5" fill="#e8eaf0">running</text><circle cx="506" cy="25" r="5" fill="#16a34a"/><text x="515" y="29" font-size="10.5" fill="#e8eaf0">success</text><circle cx="566" cy="25" r="5" fill="#dc2626"/><text x="575" y="29" font-size="10.5" fill="#e8eaf0">failure</text><rect x="20" y="12" width="104" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><rect x="20" y="230" width="600" height="58" rx="9" fill="#1e2433" stroke="#3b4357"/><g class="f0" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 1</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Drive path is RUNNING, so the Sequence is RUNNING.</text></g><g class="f1" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 2</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Drive path succeeds, but Aim answers FAILURE (no target in view).</text><text x="36" y="274" font-size="14" fill="#e8eaf0">The Sequence stops here and reports FAILURE.</text></g><g class="f2" opacity="1"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 2</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Shoot was never ticked. A Sequence gives up at the first failure,</text><text x="36" y="274" font-size="14" fill="#e8eaf0">so Shoot can rely on Aim having worked.</text></g><g class="f3" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Next run</text><text x="36" y="254" font-size="14" fill="#e8eaf0">After a FAILURE every child is reset: the next run starts</text><text x="36" y="274" font-size="14" fill="#e8eaf0">again at Drive path.</text></g></svg>

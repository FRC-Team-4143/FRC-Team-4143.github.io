p-end,kew-aim 8.20s infinite step-end}.e-shoot{animation:ke-shoot 8.20s infinite step-end}.e-shoot{animation:ke-shoot 8.20s infinite step-end,kew-shoot 8.20s infinite step-end}.r-seq{animation:kr-seq 8.20s infinite step-end}.g-seq{animation:kg-seq 8.20s infinite step-end}.b-seq-running{animation:kb-seq-running 8.20s infinite step-end}.b-seq-success{animation:kb-seq-success 8.20s infinite step-end}.b-seq-failure{animation:kb-seq-failure 8.20s infinite step-end}.r-drive{animation:kr-drive 8.20s infinite step-end}.g-drive{animation:kg-drive 8.20s infinite step-end}.b-drive-running{animation:kb-drive-running 8.20s infinite step-end}.b-drive-success{animation:kb-drive-success 8.20s infinite step-end}.b-drive-failure{animation:kb-drive-failure 8.20s infinite step-end}.r-aim{animation:kr-aim 8.20s infinite step-end}.g-aim{animation:kg-aim 8.20s infinite step-end}.b-aim-running{animation:kb-aim-running 8.20s infinite step-end}.b-aim-success{animation:kb-aim-success 8.20s infinite step-end}.b-aim-failure{animation:kb-aim-failure 8.20s infinite step-end}.r-shoot{animation:kr-shoot 8.20s infinite step-end}.g-shoot{animation:kg-shoot 8.20s infinite step-end}.b-shoot-running{animation:kb-shoot-running 8.20s infinite step-end}.b-shoot-success{animation:kb-shoot-success 8.20s infinite step-end}.b-shoot-failure{animation:kb-shoot-failure 8.20s infinite step-end}.f0{animation:kf0 8.20s infinite step-end}.f1{animation:kf1 8.20s infinite step-end}.f2{animation:kf2 8.20s infinite step-end}.f3{animation:kf3 8.20s infinite step-end}}</style><path class="e-drive" d="M320 75.0V106.0H110V137.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/><path class="e-aim" d="M320 75.0V106.0H320V137.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/><path class="e-shoot" d="M320 75.0V106.0H530V137.0" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/><rect class="r-seq" x="264.0" y="37.0" width="112" height="38" rx="7" fill="#dc262
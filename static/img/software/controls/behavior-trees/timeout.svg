16" y="240.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="150" y="252.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-aim-success" opacity="0"><rect x="116" y="240.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="150" y="252.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-aim-failure" opacity="0"><rect x="116" y="240.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="150" y="252.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect class="r-backup" x="440.0" y="121.0" width="120" height="38" rx="19.0" fill="#6b7280"/><rect class="g-backup" x="436.0" y="117.0" width="128" height="46" rx="23.0" fill="none" stroke="#facc15" stroke-width="3" opacity="0"/><text x="500" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Backup path</text><g class="b-backup-running" opacity="0"><rect x="466" y="152.0" width="68" height="16" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="500" y="164.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">RUNNING</text></g><g class="b-backup-success" opacity="0"><rect x="466" y="152.0" width="68" height="16" rx="8" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="500" y="164.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">SUCCESS</text></g><g class="b-backup-failure" opacity="0"><rect x="466" y="152.0" width="68" height="16" rx="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="500" y="164.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect x="370" y="12" width="250" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><circle cx="386" cy="25" r="5" fill="#6b7280"/><text x="395" y="29" font-size="10.5" fill="#e8eaf0">idle</text><circle cx="446" cy="25" r="5" fill="#f59e0b"/><text x="455" y="29" font-size="10.5" fill="#e8eaf0">running</text><circle cx="506" cy="25" r="5" fill="#16a34a"/><text x="515" y="29" font-size="10.5" fill="#e8eaf0">success</text><circle cx="566" cy="25" r="5" fill="#dc2626"/><text x="575" y="29" font-size="10.5" fill="#e8eaf0">failure</text><rect x="20" y="12" width="104" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><rect x="20" y="320" width="600" height="58" rx="9" fill="#1e2433" stroke="#3b4357"/><g class="f0" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">0.0 s</text><text x="36" y="344" font-size="14" fill="#e8eaf0">The Timeout ticks Aim and starts a 3 second clock.</text></g><g class="f1" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">1.5 s</text><text x="36" y="344" font-size="14" fill="#e8eaf0">Aim is still RUNNING, so the Timeout is RUNNING.</text></g><g class="f2" opacity="1"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">3.0 s</text><text x="36" y="344" font-size="14" fill="#e8eaf0">Time is up. The Timeout halts Aim (back to idle)</text><text x="36" y="364" font-size="14" fill="#e8eaf0">and answers FAILURE.</text></g><g class="f3" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">3.0 s</text><text x="36" y="344" font-size="14" fill="#e8eaf0">The Fallback moves on to plan B: Backup path is RUNNING.</text></g><g class="f4" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">5.0 s</text><text x="36" y="344" font-size="14" fill="#e8eaf0">Backup path succeeds, so the Fallback reports SUCCESS.</text><text x="36" y="364" font-size="14" fill="#e8eaf0">A step that hangs can no longer stall the whole auto.</text></g><g class="f5" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Next run</text><text x="36" y="344" font-size="14" fill="#e8eaf0">Everything is reset for the next run.</text></g></svg>

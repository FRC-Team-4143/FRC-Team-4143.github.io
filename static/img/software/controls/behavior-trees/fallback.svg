or="middle" font-size="10" font-weight="700" fill="#fff">FAILURE</text></g><rect x="370" y="12" width="250" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><circle cx="386" cy="25" r="5" fill="#6b7280"/><text x="395" y="29" font-size="10.5" fill="#e8eaf0">idle</text><circle cx="446" cy="25" r="5" fill="#f59e0b"/><text x="455" y="29" font-size="10.5" fill="#e8eaf0">running</text><circle cx="506" cy="25" r="5" fill="#16a34a"/><text x="515" y="29" font-size="10.5" fill="#e8eaf0">success</text><circle cx="566" cy="25" r="5" fill="#dc2626"/><text x="575" y="29" font-size="10.5" fill="#e8eaf0">failure</text><rect x="20" y="12" width="104" height="26" rx="13" fill="#1e2433" stroke="#3b4357"/><rect x="20" y="230" width="600" height="58" rx="9" fill="#1e2433" stroke="#3b4357"/><g class="f0" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 1</text><text x="36" y="254" font-size="14" fill="#e8eaf0">A Fallback tries its children in order.</text><text x="36" y="274" font-size="14" fill="#e8eaf0">Aim: vision is RUNNING, so the Fallback waits.</text></g><g class="f1" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 2</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Aim: vision FAILS, so the Fallback tries its next child:</text><text x="36" y="274" font-size="14" fill="#e8eaf0">Aim: manual.</text></g><g class="f2" opacity="1"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 3</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Aim: manual SUCCEEDS. The Fallback stops and reports SUCCESS;</text><text x="36" y="274" font-size="14" fill="#e8eaf0">Skip the shot is never tried.</text></g><g class="f3" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Run again</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Now suppose nothing works...</text></g><g class="f4" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 1</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Again the Fallback starts with Aim: vision.</text><text x="36" y="274" font-size="14" fill="#e8eaf0">It is RUNNING, so the Fallback waits.</text></g><g class="f5" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 2</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Aim: vision FAILS, so the Fallback tries Aim: manual.</text><text x="36" y="274" font-size="14" fill="#e8eaf0">It is RUNNING.</text></g><g class="f6" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 3</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Aim: manual FAILS too, so the Fallback tries its last child:</text><text x="36" y="274" font-size="14" fill="#e8eaf0">Skip the shot is RUNNING.</text></g><g class="f7" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Tick 4</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Skip the shot FAILS. Every child has failed, so the Fallback</text><text x="36" y="274" font-size="14" fill="#e8eaf0">reports FAILURE. Only now does its parent hear bad news.</text></g><g class="f8" opacity="0"><text x="72" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e8eaf0">Next run</text><text x="36" y="254" font-size="14" fill="#e8eaf0">Everything is reset for the next run.</text></g></svg>
